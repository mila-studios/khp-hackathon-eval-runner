<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Hackathon Eval Runner</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        article { max-width: 400px; width: 100%; }
        .error { color: var(--pico-del-color); font-size: 0.9rem; }
    </style>
</head>
<body>
    <article>
        <header><h2>Hackathon Dashboard (Admin)</h2></header>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        <form method="post" action="/admin/dashboard/login">
            <label for="api_key">Admin API Key</label>
            <input type="password" id="api_key" name="api_key" placeholder="Enter your ADMIN_API_KEY" required autofocus>
            <button type="submit">Login</button>
        </form>
    </article>
</body>
</html>
